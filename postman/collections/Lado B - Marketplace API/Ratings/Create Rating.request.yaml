$kind: http-request
name: Create Rating
method: POST
url: '{{baseUrl}}/api/v1/ratings'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "ratedId": 2,
      "summery": "Excelente vendedor",
      "rating": 5,
      "description": "Muy buen vendedor, el producto llegó en perfecto estado"
    }
