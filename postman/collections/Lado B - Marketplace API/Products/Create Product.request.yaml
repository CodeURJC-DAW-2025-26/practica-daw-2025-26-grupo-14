$kind: http-request
name: Create Product
method: POST
url: '{{baseUrl}}/products'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "sellerId": 1,
      "name": "Vintage Jacket",
      "price": 25.99,
      "category": "Clothing",
      "shortDescription": "A great vintage jacket",
      "fullDescription": "Full description of the vintage jacket",
      "condition": "Good",
      "contactPreference": "Email",
      "reported": false,
      "reportedMessage": null
    }
