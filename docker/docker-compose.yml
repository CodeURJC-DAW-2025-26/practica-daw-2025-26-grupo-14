services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ladob
      MYSQL_ROOT_PASSWORD: Th1$1$MyP@$$W0Rd
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    image: ladob-api:latest
    ports:
      - "8443:8443"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/ladob?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Th1$1$MyP@$$W0Rd
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql-data: