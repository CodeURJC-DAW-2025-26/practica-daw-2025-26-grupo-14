<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in</title>

  <!-- Favicon-->

  <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
  <!-- Bootstrap icons-->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
  <!-- Core theme CSS -->
  <link href="css/styles.css" rel="stylesheet" />

  <!-- MDB CSS -->

  <link href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.4.0/mdb.min.css" rel="stylesheet"/>
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
</head>

<body class="bg-light">

<!-- HEADER (idéntico al tuyo) -->

<header>
  <div class="p-3 text-center bg-white border-bottom">
    <div class="container">
      <div class="row gy-3">


    <!-- Logo -->
    <div class="col-lg-2 col-sm-4 col-4">
      <a href="main.html" class="float-start">
        <img src="https://cdn-icons-png.flaticon.com/256/13410/13410905.png" height="35" />
      </a>
    </div>

    <!-- Buttons -->
    <div class="order-lg-last col-lg-4 col-sm-6 col-6">
          <div class="d-flex align-items-center gap-1 flex-wrap">
            <a href="login.html" class="btn btn-outline-dark btn-sm d-flex align-items-center"><i class="fas fa-user-alt me-2"></i><span>Log in</span></a>
            <a href="register.html" class="btn btn-outline-secondary btn-sm d-flex align-items-center"><i class="fas fa-user-plus me-2"></i><span>Register</span> </a>
            <a href="publish.html" class="btn btn-primary btn-sm d-flex align-items-center"><i class="fas fa-tag me-2"></i><span>Sell</span></a>
            <a href="my-listings.html" class="btn btn-outline-primary btn-sm d-flex align-items-center"><i class="fas fa-box me-2"></i><span>My items</span> </a>
            <a href="administrator.html" class="btn btn-dark btn-sm d-flex align-items-center"><i class="fas fa-user-shield me-2"></i><span>admin</span> </a>
            <a href="my_deals.html" class="btn btn-outline-secondary btn-sm d-flex align-items-center"><i class="fas fa-shopping-cart me-2"></i><span>My deals</span> </a>
          </div>
    </div>

    <!-- Search -->
    <div class="col-lg-5 col-md-12 col-12">
      <form action="normal_search.html">
        <div class="input-group">
          <input type="search" class="form-control" placeholder="Search products"/>
          <button class="btn btn-primary">
            <i class="fas fa-search"></i>
          </button>
        </div>
      </form>
    </div>

  </div>
</div>


  </div>
</header>

<!-- LOGIN FORM -->

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-5 col-md-7">


  <div class="card shadow-sm border-0">
    <div class="card-body p-4">

      <div class="text-center mb-4">
        <h2 class="fw-bold">Sign in</h2>
        <p class="text-muted mb-0">Access your account</p>
      </div>

      <form>

        <!-- Email or username -->
        <div class="mb-3">
          <label class="form-label">Email or username</label>
          <input type="text" class="form-control" placeholder="Enter your email or username" required>
        </div>

        <!-- Password -->
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" required>
        </div>

        <!-- Remember me -->
        <div class="d-flex justify-content-between mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="remember">
            <label class="form-check-label" for="remember">Remember me</label>
          </div>
          <a href="#">Forgot password?</a>
        </div>

        <!-- Login button -->
        <div class="d-grid mb-3">
          <a href="main.html" class="btn btn-primary btn-lg">Sign in</a>
        </div>

        <div class="text-center text-muted">
          Don't have an account?
          <a href="register.html">Create one</a>
        </div>

        <hr class="my-4">

        <!-- Social login visual -->
        <div class="text-center">
          <p class="text-muted small mb-2">or continue with</p>
          <a href="#" class="btn btn-outline-secondary me-2"><i class="fab fa-google"></i></a>
          <a href="#" class="btn btn-outline-secondary me-2"><i class="fab fa-facebook-f"></i></a>
          <a href="#" class="btn btn-outline-secondary"><i class="fab fa-apple"></i></a>
        </div>

      </form>

    </div>
  </div>

</div>


  </div>
</div>

<footer class="bg-white border-top text-center py-3">
  <small class="text-muted">© 2026 SecondHand Marketplace</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
