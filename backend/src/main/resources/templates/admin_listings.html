<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Moderation</title>
        <!-- Favicon-->
        <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
        
        <!-- Core theme CSS (includes Bootstrap)-->
        <link href="/css/styles.css" rel="stylesheet" />

        <!-- MDB CSS -->
        <link
                href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.4.0/mdb.min.css"
                rel="stylesheet"
                />
        <!-- Bootstrap icons-->
        
        
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
        <!-- Font Awesome -->
        <link
                href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
                rel="stylesheet"
                />
<style>
body{background:#f4f6f9}
.sidebar{height:100vh;background:#212529}
.sidebar a{color:#adb5bd;text-decoration:none;padding:12px 18px;display:block}
.sidebar a:hover{background:#343a40;color:#fff}
.sidebar .active{background:#0d6efd;color:#fff}
</style>
</head>
<body>
  <!--Main Navigation-->
{{> header}}
<div class="container-fluid">
  <div class="row">
    <div class="col-md-2 sidebar p-0">
      <h4 class="text-white text-center py-3 border-bottom">Admin Panel</h4>
      <a href="administrator"><i class="fas fa-chart-line me-2"></i>Dashboard</a>
      <a href="admin_users"><i class="fas fa-users me-2"></i>Users</a>
      <a href="admin_listings" class="active"><i class="fas fa-flag me-2"></i>Moderation</a>
      <a href="admin_stats"><i class="fas fa-chart-pie me-2"></i>Statistics</a>
      <a href="/"><i class="fas fa-sign-out-alt me-2"></i>Logout</a>
    </div>
    <div class="col-md-10 p-4">
      <h2 class="mb-4">Reported Listings</h2>
      <div class="card shadow-sm">
        <div class="card-body">
          <table class="table table-striped align-middle">
            <thead>
              <tr>
                <th>Item</th>
                <th>Seller</th>
                <th>Reason</th>
                <th class="text-end">Action</th>
              </tr>
            </thead>
            <tbody id="admin_listings_tree"></tbody>
          </table>

              {{#Products}}
                <div class="text-center mt-3">
                  <button id="load-more-btn_admin" class="btn btn-outline-dark">Load more</button>       
                </div>
              {{/Products}}
          
            
          

          {{^Products}}
          <p> Not products yet. </p>
          {{/Products}}
        </div>
      </div>
    </div>
  </div>
</div>
{{> footer}}
<script>
  let page = 0;
  const size = 10;
  const row = document.getElementById('admin_listings_tree');
  const btn = document.getElementById('load-more-btn_admin');
  const csrfToken = "{{token}}";

  function renderProduct(p) {
    return `
        <tr>
          <td>${p.name}</td>
          <td>${p.sellerName}</td>
          <td>${p.reportedMessage}</td>
          <td class="text-end">
            <form action="/deleteproduct/${p.id}" method="post" style="display:inline;">
              <input type="hidden" name="_csrf" value="${csrfToken}">
              <button type="submit" class="btn btn-danger btn-sm">Remove</button>
            </form>
            <a href="/ignore_report/${p.id}" class="btn btn-outline-secondary btn-sm">Ignore</a>
          </td>
        </tr>`;
  }

        async function loadMore() {
            const res = await fetch(`/products/page?page=${page}&size=${size}&reported=true`);
            const data = await res.json();
            row.insertAdjacentHTML('beforeend', data.products.map(renderProduct).join(''));
            page++;
            if (!data.hasNext) btn.style.display = 'none';
        }

        btn.addEventListener('click', loadMore);
        loadMore();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
