<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>My listings</title>
        <!-- Favicon-->
        <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
        <!-- Bootstrap icons-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
        <!-- Core theme CSS (includes Bootstrap)-->
        <link href="/css/styles.css" rel="stylesheet" />

        <!-- MDB CSS -->
        <link
                href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.4.0/mdb.min.css"
                rel="stylesheet"
                />
        <!-- Font Awesome -->
        <link
                href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
                rel="stylesheet"
                />
    </head>
<body>

<!-- NAVBAR -->
<!--Main Navigation-->
{{> header}}
<!-- HEADER -->
<div class="bg-light py-4 border-bottom mb-4">
  <div class="container d-flex justify-content-between align-items-center">
    <div>
      <h2 class="mb-0">My listings</h2>
      <small class="text-muted">Items you are currently selling</small>
    </div>
    <a href="publish" class="btn btn-primary">+ New item</a>
  </div>
</div>

<!-- ITEMS GRID -->
<div class="container mb-5">
  <div id="my_listings_row" class="row g-4"></div>
  <div id="my-listings-spinner" class="loading-indicator is-hidden" role="status" aria-live="polite">
    <div class="spinner-border spinner-border-sm" aria-hidden="true"></div>
    <span>Loading items...</span>
  </div>
   
  <div class="text-center mt-3">
    <button id="load-more-btn_listings" class="btn btn-outline-dark">Load more</button>       
  </div>
  
</div>

{{> footer}}
<script>
  let page = 0;
  const size = 10;
  const row = document.getElementById('my_listings_row');
  const btn = document.getElementById('load-more-btn_listings');
  const spinner = document.getElementById('my-listings-spinner');
  const csrfToken = "{{token}}";
  let isLoading = false;

  function renderProduct(p) {
    return `
      <div class="col-md-4">
        <div class="card h-100 shadow-sm">
          <a href="/product/${p.id}">
            <img src="${p.imageId ? '/images/' + p.imageId : '/my_images/noImage.png'}" class="card-img-top rounded-2" style="aspect-ratio:1/1"/>
          </a>
          <div class="card-body">
            <h5 class="card-title">${p.name}</h5>
            <p class="text-success fw-bold">${p.price} €</p>
            <small class="text-muted">Published on ${p.createdAt}</small>
          </div>
          <div class="card-footer bg-white border-0 d-flex justify-content-between">
            <a href="editproduct/${p.id}" class="btn btn-outline-secondary btn-sm">Edit</a>
            <form action="/deleteproduct/${p.id}" method="post" style="display:inline;">
              <input type="hidden" name="_csrf" value="${csrfToken}">
              <button type="submit" class="btn btn-outline-danger btn-sm">Delete</button>
            </form>
          </div>
        </div>
      </div>`;
  }

        function setLoading(loading) {
            isLoading = loading;
            spinner.classList.toggle('is-hidden', !loading);
            btn.disabled = loading;
        }

        async function loadMore() {
            if (isLoading) return;

            setLoading(true);
            try {
                const res = await fetch(`/products/page?page=${page}&size=${size}&sellerId={{user.id}}`);
                const data = await res.json();
                row.insertAdjacentHTML('beforeend', data.products.map(renderProduct).join(''));
                page++;
                sleep(500); // Simulate loading delay 
                if (!data.hasNext) btn.style.display = 'none';
            } finally {
                setLoading(false);
            }
        }

        btn.addEventListener('click', loadMore);
        loadMore();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
