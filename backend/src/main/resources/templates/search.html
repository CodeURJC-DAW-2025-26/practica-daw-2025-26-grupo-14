<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>Search</title>
        <!-- Favicon-->
        <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
        <!-- Bootstrap icons-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
        <!-- Core theme CSS (includes Bootstrap)-->
        <link href="/css/styles.css" rel="stylesheet" />

        <!-- MDB CSS -->
        <link
                href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.4.0/mdb.min.css"
                rel="stylesheet"
                />
        <!-- Font Awesome -->
        <link
                href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
                rel="stylesheet"
                />
    </head>
  <body>

<!--Main Navigation-->
{{> header}}


<!-- sidebar + content -->
<section class="">
  <div class="container">
    <div class="row">
       
      <!-- sidebar -->
      <div class="col-lg-3">
      <!-- Filter section -->
      
        <div class = "card p-3 mb-4">
          <h5>Filter by</h5>
          <!-- Min¬Max Price -->
          <div class="mb-3">
            <label class= "form-label">Min Price</label>
            <input type="number" class="form-control mb-3" id="minPrice" name="minPrice" placeholder="0">
            <label class= "form-label">Max Price</label>
            <input type="number" class="form-control mb-3" id="maxPrice" name="maxPrice" placeholder="1000">
          </div>
          <div class="mb-3">
            <label class="form-label">Minimun Seller Rate</label>
            <select id="minSellerRate" class="form-select">
              <option value="">⭐+</option>
              <option value="1">⭐⭐+</option>
              <option value="2">⭐⭐⭐+</option>
              <option value="3">⭐⭐⭐⭐+</option>
              <option value="4">⭐⭐⭐⭐⭐</option>
            </select>
          </div>
          <button id="price-filter-btn" class="btn btn-outline-secondary w-100">Apply</button>
        </div>
      
        <!-- Toggle button -->
        <button
                class="btn btn-outline-secondary mb-3 w-100 d-lg-none"
                type="button"
                data-mdb-toggle="collapse"
                data-mdb-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent"
                aria-expanded="false"
                aria-label="Toggle navigation"
                >
          <span>Show filter</span>
        </button>

      </div>
      <!-- sidebar -->
      <!-- content -->
      <div class="col-lg-9">
        <header class="d-sm-flex align-items-center border-bottom mb-4 pb-3">
          <strong class="d-block py-2">Items found </strong>
          
        </header>

        <div id="products_div" class="row"></div>
        <div id="products-spinner" class="loading-indicator is-hidden" role="status" aria-live="polite">
          <div class="spinner-border spinner-border-sm" aria-hidden="true"></div>
          <span>Loading items...</span>
        </div>
        <div class="text-center">
          <button id="load-more-btn" class="btn btn-outline-dark">load more</button>
        </div>

          <script>
          let page = 0;
          const size = 10;
          const row = document.getElementById('products_div');
          const btn = document.getElementById('load-more-btn');
          const spinner = document.getElementById('products-spinner');
          const currentParams = new URLSearchParams(window.location.search); // category, keyword...
          let isLoading = false;

          function renderProduct(p) {
            return `
              <div class="col-lg-4 col-md-6 col-sm-6 d-flex">
                <div class="card w-100 my-2 shadow-2-strong">
                  <a href="/product/${p.id}">
                    <img src="${p.imageId ? '/images/' + p.imageId : '/images/noImage.png'}" class="card-img-top"/>
                  </a>
                  <div class="card-body">
                    <h5>${p.name}</h5>
                    <p>${p.shortDescription ?? ''}</p>
                    <h6>${p.price} €</h6>
                  </div>
                </div>
              </div>`;
          }

          function setLoading(loading) {
            isLoading = loading;
            spinner.classList.toggle('is-hidden', !loading);
            btn.disabled = loading;
          }

          async function loadMore() {
            if (isLoading) return;

            const params = new URLSearchParams(currentParams);
            params.set('page', page);
            params.set('size', size);

            setLoading(true);
            try {
              const res = await fetch(`/products/page?${params.toString()}`);
              const data = await res.json();

              row.insertAdjacentHTML('beforeend', data.products.map(renderProduct).join(''));
              page++;
              //sleep(500); // Simulate loading delay 
              if (!data.hasNext) btn.style.display = 'none';
            } finally {
              setLoading(false);
            }
          }


          document.getElementById('price-filter-btn').addEventListener('click', () => {
            const minPrice = document.getElementById('minPrice').value;
            const maxPrice = document.getElementById('maxPrice').value;

            if (minPrice) currentParams.set('minPrice', minPrice);
            else currentParams.delete('minPrice');

            if (maxPrice) currentParams.set('maxPrice', maxPrice);
            else currentParams.delete('maxPrice');

            const minSellerRate = document.getElementById('minSellerRate').value;

            if (minSellerRate) currentParams.set('minSellerRate', minSellerRate);
            else currentParams.delete('minSellerRate');

            //update URL
            history.replaceState( null, "", "?" + currentParams.toString());


            // Reset page and products
            page = 0;
            row.innerHTML = '';
            btn.style.display = 'block';
            loadMore();
          });

          btn.addEventListener('click', loadMore);
          loadMore();
          </script>

        </div>

        
      </div>
    </div>
  </div>            
</section>
<!-- sidebar + content -->

<!-- Footer -->
{{> footer}}
<!-- Footer -->

  </body>
</html>
