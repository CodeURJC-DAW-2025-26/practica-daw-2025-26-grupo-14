<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>Shop Item - Start Bootstrap Template</title>
        <!-- Favicon-->
        <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
        <!-- Bootstrap icons-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
        <!-- Core theme CSS (includes Bootstrap)-->
        <link href="css/styles.css" rel="stylesheet" />

        <!-- MDB CSS -->
        <link
                href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.4.0/mdb.min.css"
                rel="stylesheet"
                />
        <!-- Font Awesome -->
        <link
                href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
                rel="stylesheet"
                />
    </head>
<body>

<!-- NAVBAR -->
<!--Main Navigation-->
{{> header}}
<!-- HEADER -->
<div class="bg-light py-4 border-bottom mb-4">
  <div class="container d-flex justify-content-between align-items-center">
    <div>
      <h2 class="mb-0">My listings</h2>
      <small class="text-muted">Items you are currently selling</small>
    </div>
    <a href="publish" class="btn btn-primary">+ New item</a>
  </div>
</div>

<!-- ITEMS GRID -->
<div class="container mb-5">
  <div class="row g-4">

    <!-- ITEM 1 -->
     {{#products}}
    <div class="col-md-4">
      <div class="card h-100 shadow-sm">
        <a href="product/{{id}}"><img src="{{imageUrl}}" class="card-img-top"></a>
        <div class="card-body">
          <h5 class="card-title">{{name}}</h5>
          <p class="text-success fw-bold">{{price}} €</p>
          <small class="text-muted">Published on {{createdAt}}</small>
        </div>
        <div class="card-footer bg-white border-0 d-flex justify-content-between">
          <a href="editproduct/{{id}}" class="btn btn-outline-secondary btn-sm">Edit</a>
          <a href="deleteproduct/{{id}}" class="btn btn-outline-danger btn-sm">Delete</a>
        </div>
      </div>
    </div>
    {{/products}}

  </div>
</div>

{{> footer}}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
