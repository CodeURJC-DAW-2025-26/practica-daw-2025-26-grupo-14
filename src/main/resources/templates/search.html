<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>Search</title>
        <!-- Favicon-->
        <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
        <!-- Bootstrap icons-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
        <!-- Core theme CSS (includes Bootstrap)-->
        <link href="/css/styles.css" rel="stylesheet" />

        <!-- MDB CSS -->
        <link
                href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.4.0/mdb.min.css"
                rel="stylesheet"
                />
        <!-- Font Awesome -->
        <link
                href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
                rel="stylesheet"
                />
    </head>
  <body>

<!--Main Navigation-->
{{> header}}

<!-- sidebar + content -->
<section class="">
  <div class="container">
    <div class="row">
      <!-- sidebar -->
      <div class="col-lg-3">
        <!-- Toggle button -->
        <button
                class="btn btn-outline-secondary mb-3 w-100 d-lg-none"
                type="button"
                data-mdb-toggle="collapse"
                data-mdb-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent"
                aria-expanded="false"
                aria-label="Toggle navigation"
                >
          <span>Show filter</span>
        </button>
       
      </div>
      <!-- sidebar -->
      <!-- content -->
      <div class="col-lg-9">
        <header class="d-sm-flex align-items-center border-bottom mb-4 pb-3">
          <strong class="d-block py-2">Items found </strong>
          
        </header>

        <div id="products_div" class="row">
          
          <button id="load-more-btn" class="btn btn-outline-dark">Cargar más</button>

          <script>
          let page = 0;
          const size = 10;
          const row = document.getElementById('products_div');
          const btn = document.getElementById('load-more-btn');
          const currentParams = new URLSearchParams(window.location.search); // category, keyword...

          function renderProduct(p) {
            return `
              <div class="col-lg-4 col-md-6 col-sm-6 d-flex">
                <div class="card w-100 my-2 shadow-2-strong">
                  <a href="/product/${p.id}">
                    <img src="${p.imageId ? '/images/' + p.imageId : '/images/noImage.png'}" class="card-img-top"/>
                  </a>
                  <div class="card-body">
                    <h5>${p.name}</h5>
                    <p>${p.shortDescription ?? ''}</p>
                    <h6>${p.price} €</h6>
                  </div>
                </div>
              </div>`;
          }

          async function loadMore() {
            const params = new URLSearchParams(currentParams);
            params.set('page', page);
            params.set('size', size);

            const res = await fetch(`/products/page?${params.toString()}`);
            const data = await res.json();

            row.insertAdjacentHTML('beforeend', data.products.map(renderProduct).join(''));
            page++;
            if (!data.hasNext) btn.style.display = 'none';
          }

          btn.addEventListener('click', loadMore);
          loadMore();
          </script>

        </div>

        
      </div>
    </div>
  </div>            
</section>
<!-- sidebar + content -->

<!-- Footer -->
{{> footer}}
<!-- Footer -->

  </body>
</html>
