<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account</title>

        <!-- Favicon-->
        <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
        <!-- Bootstrap icons-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
        <!-- Core theme CSS (includes Bootstrap)-->
        <link href="css/styles.css" rel="stylesheet" />

        <!-- MDB CSS -->
        <link
                href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.4.0/mdb.min.css"
                rel="stylesheet"
                />
        <!-- Font Awesome -->
        <link
                href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
                rel="stylesheet"
                />
</head>
<body class="bg-light">

<!--Main Navigation-->
{{> header}}

<!-- REGISTER FORM -->
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">

      <div class="card shadow-sm border-0">
        <div class="card-body p-4">

          <div class="text-center mb-4">
            <h2 class="fw-bold">Create your account</h2>
            <p class="text-muted mb-0">Join our marketplace to buy and sell items</p>
          </div>

          <form>

            <!-- Full name -->
            <div class="mb-3">
              <label class="form-label">Full name</label>
              <input type="text" class="form-control" placeholder="John Doe" required>
            </div>

            <!-- Username -->
            <div class="mb-3">
              <label class="form-label">Username</label>
              <input type="text" class="form-control" placeholder="john_doe123" required>
            </div>

            <!-- Email -->
            <div class="mb-3">
              <label class="form-label">Email address</label>
              <input type="email" class="form-control" placeholder="name@example.com" required>
            </div>

            <!-- Location -->
            <div class="mb-3">
              <label class="form-label">City</label>
              <input type="text" class="form-control" placeholder="Madrid">
            </div>

            <!-- Password -->
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" class="form-control" required>
            </div>

            <!-- Confirm password -->
            <div class="mb-3">
              <label class="form-label">Confirm password</label>
              <input type="password" class="form-control" required>
            </div>

            <!-- Terms -->
            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="terms" required>
              <label class="form-check-label" for="terms">
                I agree to the Terms & Conditions
              </label>
            </div>

            <!-- Register button -->
            <div class="d-grid mb-3">
              <a href="/" class="btn btn-primary btn-lg">Create account</a>
            </div>

            <div class="text-center text-muted">
              Already have an account?
              <a href="login">Sign in</a>
            </div>

            <hr class="my-4">

            <!-- Social login (visual only) -->
            <div class="text-center">
              <p class="text-muted small mb-2">or sign up with</p>
              <a href="#" class="btn btn-outline-secondary me-2"><i class="fab fa-google"></i></a>
              <a href="#" class="btn btn-outline-secondary me-2"><i class="fab fa-facebook-f"></i></a>
              <a href="#" class="btn btn-outline-secondary"><i class="fab fa-apple"></i></a>
            </div>

          </form>
        </div>
      </div>

    </div>
  </div>
</div>

{{> footer}}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
