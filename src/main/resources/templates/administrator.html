<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>
        <!-- Favicon-->
        <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
        
        <!-- Core theme CSS (includes Bootstrap)-->
        <link href="/css/styles.css" rel="stylesheet" />

        <!-- MDB CSS -->
        <link
                href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.4.0/mdb.min.css"
                rel="stylesheet"
                />
        <!-- Bootstrap icons-->
        
        
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
        <!-- Font Awesome -->
        <link
                href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
                rel="stylesheet"
                />

<style>
body{background:#f4f6f9;}
.sidebar{
  height:100vh;
  background:#212529;
}
.sidebar a{
  color:#adb5bd;
  text-decoration:none;
  padding:12px 18px;
  display:block;
}
.sidebar a:hover{
  background:#343a40;
  color:white;
}
.sidebar .active{
  background:#0d6efd;
  color:white;
}
.card-stat{
  border:none;
  border-radius:12px;
}
</style>
</head>
<body>
<!--Main Navigation-->
{{> header}}

<div class="container-fluid">
  <div class="row">

    <!-- SIDEBAR -->
    <div class="col-md-2 sidebar p-0">
      <h4 class="text-white text-center py-3 border-bottom">Admin Panel</h4>
      <a href="administrator" class="active"><i class="fas fa-chart-line me-2"></i>Dashboard</a>
      <a href="admin_users"><i class="fas fa-users me-2"></i>Users</a>
      <a href="admin_listings"><i class="fas fa-flag me-2"></i>Moderation</a>
      <a href="admin_stats"><i class="fas fa-chart-pie me-2"></i>Statistics</a>
      <a href="/"><i class="fas fa-sign-out-alt me-2"></i>Home</a>
    </div>

    <!-- MAIN CONTENT -->
    <div class="col-md-10 p-4">
      <h2 class="mb-4">Dashboard</h2>

      <div class="row g-4">

        <div class="col-md-3">
          <div class="card card-stat shadow-sm p-3">
            <h6 class="text-muted">Total Users</h6>
            <h3>1,284</h3>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card card-stat shadow-sm p-3">
            <h6 class="text-muted">Active Listings</h6>
            <h3>542</h3>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card card-stat shadow-sm p-3">
            <h6 class="text-muted">Items Sold Today</h6>
            <h3>37</h3>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card card-stat shadow-sm p-3">
            <h6 class="text-muted">Reports Pending</h6>
            <h3>12</h3>
          </div>
        </div>

      </div>

      <div class="mt-5">
        <h4>Quick actions</h4>
        <div class="row g-3 mt-2">

          <div class="col-md-4">
            <a href="admin_users" class="btn btn-outline-primary w-100 p-3">
              <i class="fas fa-user-slash me-2"></i>Manage Users
            </a>
          </div>

          <div class="col-md-4">
            <a href="admin_listings" class="btn btn-outline-danger w-100 p-3">
              <i class="fas fa-ban me-2"></i>Moderate Listings
            </a>
          </div>

          <div class="col-md-4">
            <a href="admin_stats" class="btn btn-outline-success w-100 p-3">
              <i class="fas fa-chart-bar me-2"></i>View Statistics
            </a>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>
{{> footer}}
<script src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.4.0/mdb.min.js"></script>
</body>
</html>
