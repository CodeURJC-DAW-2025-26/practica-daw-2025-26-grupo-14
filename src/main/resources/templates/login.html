<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in</title>

  <!-- Favicon-->

  <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
  <!-- Bootstrap icons-->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
  <!-- Core theme CSS -->
  <link href="/css/styles.css" rel="stylesheet" />

  <!-- MDB CSS -->

  <link href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.4.0/mdb.min.css" rel="stylesheet"/>
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
</head>

<body class="bg-light">

<!-- HEADER -->

{{> header}}

<!-- LOGIN FORM -->

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-5 col-md-7">


  <div class="card shadow-sm border-0">
    <div class="card-body p-4">

      <div class="text-center mb-4">
        <h2 class="fw-bold">Sign in</h2>
        <p class="text-muted mb-0">Access your account</p>
      </div>

      <form action="/login" method="post">
        <input type="hidden" name="_csrf" value="{{token}}">

        <!-- Email or username -->
        <div class="mb-3">
          <label class="form-label">Email or username</label>
          <input type="text" class="form-control" name="username" placeholder="Enter your email or username" required>
        </div>

        <!-- Password -->
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" name="password" required>
        </div>

        <!-- Remember me -->
        <div class="d-flex justify-content-between mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="remember">
            <label class="form-check-label" for="remember">Remember me</label>
          </div>
          <a href="#">Forgot password?</a>
        </div>

        <!-- Login button -->
        <div class="d-grid mb-3">
          <button type="submit" class="btn btn-primary btn-lg">Sign in</button>
        </div>

        <div class="text-center text-muted">
          Don't have an account?
          <a href="register">Create one</a>
        </div>

        <hr class="my-4">

        <!-- Social login visual -->
        <div class="text-center">
          <p class="text-muted small mb-2">or continue with</p>
          <a href="#" class="btn btn-outline-secondary me-2"><i class="fab fa-google"></i></a>
          <a href="#" class="btn btn-outline-secondary me-2"><i class="fab fa-facebook-f"></i></a>
          <a href="#" class="btn btn-outline-secondary"><i class="fab fa-apple"></i></a>
        </div>

      </form>

    </div>
  </div>

</div>


  </div>
</div>

{{> footer}}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
