<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Favicon-->
        <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
        
        <!-- Core theme CSS (includes Bootstrap)-->
        <link href="css/styles.css" rel="stylesheet" />

        <!-- MDB CSS -->
        <link
                href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.4.0/mdb.min.css"
                rel="stylesheet"
                />
        <!-- Bootstrap icons-->
        
        
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
        <!-- Font Awesome -->
        <link
                href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
                rel="stylesheet"
                />
<style>
body{background:#f4f6f9}
.sidebar{height:100vh;background:#212529}
.sidebar a{color:#adb5bd;text-decoration:none;padding:12px 18px;display:block}
.sidebar a:hover{background:#343a40;color:#fff}
.sidebar .active{background:#0d6efd;color:#fff}
</style>
</head>
<body>
  <!--Main Navigation-->
{{> header}}
<div class="container-fluid">
  <div class="row">
    <div class="col-md-2 sidebar p-0">
      <h4 class="text-white text-center py-3 border-bottom">Admin Panel</h4>
      <a href="administrator"><i class="fas fa-chart-line me-2"></i>Dashboard</a>
      <a href="admin_users"><i class="fas fa-users me-2"></i>Users</a>
      <a href="admin_listings"><i class="fas fa-flag me-2"></i>Moderation</a>
      <a href="admin_stats" class="active"><i class="fas fa-chart-pie me-2"></i>Statistics</a>
      <a href="/"><i class="fas fa-sign-out-alt me-2"></i>Logout</a>
    </div>
    <div class="col-md-10 p-4">
      <h2 class="mb-4">Sales Statistics</h2>
      <div class="card shadow-sm p-4">
        <h5>Most popular categories</h5>
        <p class="mb-1">Electronics (45%)</p>
        <div class="progress mb-3"><div class="progress-bar bg-primary" style="width:45%"></div></div>
        <p class="mb-1">Clothing (30%)</p>
        <div class="progress mb-3"><div class="progress-bar bg-success" style="width:30%"></div></div>
        <p class="mb-1">Furniture (15%)</p>
        <div class="progress mb-3"><div class="progress-bar bg-warning" style="width:15%"></div></div>
        <p class="mb-1">Other (10%)</p>
        <div class="progress mb-3"><div class="progress-bar bg-danger" style="width:10%"></div></div>
      </div>
      <div class="row mt-4 g-4">
        <div class="col-md-4"><div class="card shadow-sm p-3"><h6>Total Revenue</h6><h4>€12,430</h4></div></div>
        <div class="col-md-4"><div class="card shadow-sm p-3"><h6>New Users (30 days)</h6><h4>+84</h4></div></div>
        <div class="col-md-4"><div class="card shadow-sm p-3"><h6>Listings Created</h6><h4>231</h4></div></div>
      </div>
    </div>
  </div>
</div>
{{> footer}}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
