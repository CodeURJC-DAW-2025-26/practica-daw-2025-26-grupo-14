<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>Shop Item - Start Bootstrap Template</title>
        <!-- Favicon-->
        <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
        <!-- Bootstrap icons-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
        <!-- Core theme CSS (includes Bootstrap)-->
        <link href="css/styles.css" rel="stylesheet" />

        <!-- MDB CSS -->
        <link
                href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.4.0/mdb.min.css"
                rel="stylesheet"
                />
        <!-- Font Awesome -->
        <link
                href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
                rel="stylesheet"
                />
    </head>
<body>

<!-- NAVBAR -->
<!--Main Navigation-->
{{> header}}
<!-- PAGE HEADER -->
<div class="bg-primary text-white py-4 mb-4">
  <div class="container">
    <h2 class="mb-0">Post a new item</h2>
    <small>Create a listing to sell your product</small>
  </div>
</div>

<!-- FORM -->
<div class="container mb-5">
  <div class="card shadow-sm">
    <div class="card-body p-4">

      <form>
        <div class="row g-4">

          <!-- title -->
          <div class="col-12">
            <label class="form-label">Item title</label>
            <input type="text" class="form-control" placeholder="e.g. iPhone 12 128GB Black">
          </div>

          <!-- price -->
          <div class="col-md-4">
            <label class="form-label">Price (€)</label>
            <input type="number" class="form-control" placeholder="150">
          </div>

          <!-- category -->
          <div class="col-md-4">
            <label class="form-label">Category</label>
            <select class="form-select">
              <option>Electronics</option>
              <option>Clothing</option>
              <option>Home</option>
              <option>Sports</option>
              <option>Books</option>
              <option>Other</option>
            </select>
          </div>

          <!-- condition -->
          <div class="col-md-4">
            <label class="form-label">Condition</label>
            <select class="form-select">
              <option>New</option>
              <option>Like new</option>
              <option>Good</option>
              <option>Acceptable</option>
              <option>For parts</option>
            </select>
          </div>

          <!-- description -->
          <div class="col-12">
            <label class="form-label">Description</label>
            <textarea class="form-control" rows="5" placeholder="Describe your item, condition, pickup or shipping..."></textarea>
          </div>

          <!-- images -->
          <div class="col-12">
            <label class="form-label">Upload images</label>
            <input type="file" class="form-control" multiple>
            <small class="text-muted">(Only visual, files are not actually uploaded)</small>
          </div>

          <!-- location -->
          <div class="col-md-6">
            <label class="form-label">City</label>
            <input type="text" class="form-control" placeholder="Madrid">
          </div>

          <div class="col-md-6">
            <label class="form-label">Contact preference</label>
            <select class="form-select">
              <option>Chat</option>
              <option>Phone</option>
              <option>Both</option>
            </select>
          </div>

          <!-- submit -->
          <div class="col-12 text-end">
            <a href="my_listings" class="btn btn-primary btn-lg">Publish item</a>
          </div>

        </div>
      </form>

    </div>
  </div>
</div>

{{> footer}}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
